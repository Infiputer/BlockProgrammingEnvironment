<script>
  function format(element){
    let name = "";
    let par = []
    if(element==undefined){
      return 0;
    }
    for(let elemi=0;elemi<element.children.length;elemi++){
      let info = element.children[elemi];
      if(info.className == "name"){
        name = info.innerText;
      }
      if(info.className == "par"){
        for(let x=0;x<info.children.length;x++){
          if(info.children[x].children.length != 0){
            let needtoeval = format(info.children[x].children[0].children[0]);
            let parpush = evalBlock(needtoeval)
            console.log(needtoeval)
            if(parpush!=undefined){
              par.push(evalCode+"("+parpush+")")
            }
            else{
              par.push(info.children[x].innerText)
            }
          }
          else{
            par.push(info.children[x].innerText);
          }
        }
      }
    }
    if(element.className=="needProg"){
      return [name, par, element.children[2]]
    }
    return [name, par]
  }
